<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Link para Google Fonts (fonte Roboto) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="contamais.css">

  <title>DramaFlix</title>
</head>

<body>

  <header>
    <div class="logo">
      <img src="/img/logodrama-removebg-preview.png" alt="Logo">
    </div>
    <nav>
      <ul>
        <li><a href="/pag/index.html">Home</a></li>
        <li><a href="/pag/dramas.html">Resenhas</a></li>
      </ul>
    </nav>
    <div class="search-bar">
      <form action="/search" method="get">
        <input type="text" name="query" placeholder="Buscar dramas coreanos...">
        <button type="submit">Buscar</button>
      </form>
    </div>
  </header>
  <div class="slider">
    <div class="slides">
      <img src="/img/love.jpg" alt="Imagem 1">
      <img src="/img/vincenzo.jpg" alt="Imagem 2">
      <img src="/img/desgraça.jpg" alt="Imagem 3">
      <img src="/img/mydemon.webp" alt="Imagem 4">
      <img src="/img/kim.jpg" alt="Imagem 5">
    </div>
  </div>
  <h1>Meus Doramas</h1>

  <form id="doramaForm">
    <input type="text" id="usuario" placeholder="Nome do Usuário" required>
    <input type="text" id="dorama" placeholder="Nome do Dorama" required>
    <input type="file" id="uploadImagem" accept="image/*">
    <input type="number" id="nota" placeholder="Nota (1-10)" min="1" max="10" required>
    <textarea id="avaliacao" placeholder="Avaliação Escrita" rows="3" required></textarea>

    <button type="submit">Adicionar/Editar</button>
    <button type="button" id="cancelEdit">Cancelar </button>
  </form>

  <table id="doramaTable">
    <thead>
      <tr>
        <th>Usuário</th>
        <th>Dorama</th>
        <th>Nota</th>
        <th>Avaliação</th>
        <th>Ações</th>
        <th>Imagem</th>
      </tr>
    </thead>
    <tbody id="doramaTableBody">
      <!-- O JavaScript preenche aqui dinamicamente -->
    </tbody>
  </table>
  <script src="/script.js"></script>
  <script>
    loadDoramas();
  </script>
  <footer>
    🅾 INSTAGRAM
    <a href="https://www.instagram.com/litrao.amigo?igsh=MXJub250d3JzbHB5dw==" target="_blank">@litrao.amigo</a>
  </footer>
</body>

</html>
